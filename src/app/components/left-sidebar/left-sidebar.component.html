<div class="h-full z-100 flex flex-row">
  <div >
    <!-- Hamburger Button (Hidden on Large Screens) -->
    <button (click)="toggleSidebar()" class="lg:hidden fixed left-4 z-50 p-2 bg-white text-black rounded-md">
      <!-- Hamburger Icon -->
      <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <!-- Close Icon -->
      <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- Sidebar -->
    <div 
      [class.translate-x-0]="isOpen" 
      [class.-translate-x-full]="!isOpen"
      [ngClass]="{ 'lg:w-20': isLeftSidebarCollapsed(), 'lg:w-65': !isLeftSidebarCollapsed() }"
      class="fixed top-0 left-0 w-65 lg:w-65 bg-white p-4 h-full rounded-2xl py-6 flex flex-col justify-between transition-transform transform lg:translate-x-0 lg:static z-10">

      <!-- nav section -->
      <div class="flex flex-col gap-4">
        <!-- logo section -->
        <div class="flex gap-16 w-full  justify-center items-center md:h-auto">
          <div class="flex gap-2">
            <span class="w-[21.69px] h-[27.9px] bg-[url('./app/resources/icons/blue-book-icon.svg')] rounded-lg">
            </span>
            <div *ngIf="!isLeftSidebarCollapsed()" class="text-primary font-medium text-2xl font-(family-name:BentonSans)">Playbook</div>
          </div>
          <!-- close sidebar section -->
          <button *ngIf="!isLeftSidebarCollapsed()" class="hidden md:block w-[16.83px] h-[15.83px] mx-auto bg-[url('./app/resources/icons/sidebar-close-icon.svg')]" (click)="closeSidenav()">
          </button>
        </div>
        <!--  nav list section -->
        <div class="flex flex-col">
          <!-- main sidebar list -->
          <ul class="w-full">
            @for (item of dashboardItems; let i = $index; track item) {
              <li class="w-full py-1">
                  <a
                  class="flex gap-x-2 items-center rounded-2xl px-3 py-2 relative hover:bg-[#F6F6F6]"
                  [ngClass]="isLeftSidebarCollapsed() ? 'tooltip-btn' : ''"
                  [routerLink]="item.routeLink"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  (click)="item.label === 'Chat' && chatButton()"
                  >
                    <i class="material-icons" style="font-size: 20px;">{{item.icon}}</i>
                    <span *ngIf="!isLeftSidebarCollapsed()" class="text-primary-text-color font-normal text-sm">{{ item.label }}</span>
                    <!-- text  tooltip section -->
                    <span 
                      *ngIf="isLeftSidebarCollapsed()"
                      class="tooltip-text text-[#FFFFFF] bg-[#3D3B3B] rounded-sm py-[4px] px-[8px] font-normal text-sm absolute  left-[112%]">
                      {{ item.label }}
                    </span>
                  </a>
              </li>
            }
          </ul>
          <!-- chat sidebar list -->
          <ul class="w-full" *ngIf="!isLeftSidebarCollapsed()">
            <li class="w-full" *ngFor="let item of chatItems;">
              <span
                class="w-full flex gap-x-2 items-center rounded-2xl py-1 relative cursor-pointer"
                [ngClass]="isLeftSidebarCollapsed() ? 'tooltip-btn' : ''"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="item.label === 'Start New Chat' && startNewChat()"
              >
                <!-- Search Input -->
                <div
                  *ngIf="item.label === 'Search Previous Chats'; else otherOption"
                  class="flex items-center gap-[8px] text-primary-text-color w-full px-3 py-2 rounded-2xl hover:bg-[#F6F6F6]"
                >
                  <i class="material-icons text-search-text-color" style="font-size: 20px;"
                  [ngClass]="(item.label === 'Search Previous Chats')? 'text-search-text-color' : ''">{{ item.icon }}</i>
                  <input
                    type="text"
                    [placeholder]="!isLeftSidebarCollapsed() ? item.label : ''"
                    class="text-primary-text-color font-normal text-sm placeholder:text-search-text-color"
                    [(ngModel)]="searchValue"
                    (ngModelChange)="onInputChange($event)"
                  />
                </div>

                <!-- Other Items -->
                <ng-template #otherOption>
                  <div class="flex gap-2 items-center rounded-2xl px-3 py-2 relative hover:bg-[#F6F6F6] w-full">
                    <i class="material-icons" style="font-size: 20px;">{{ item.icon }}</i>
                    <span
                      *ngIf="!isLeftSidebarCollapsed()"
                      class="text-primary-text-color font-normal text-sm"
                    >
                      {{ item.label }}
                    </span>
                  </div>
                </ng-template>


                <!-- Tooltip if sidebar is collapsed -->
                <span
                  *ngIf="isLeftSidebarCollapsed()"
                  class="tooltip-text text-[#FFFFFF] bg-[#3D3B3B] rounded-sm py-[4px] px-[8px] font-normal text-sm absolute left-[112%]"
                >
                  {{ item.label }}
                </span>
              </span>

              <hr class="text-[#DFDFDF80]" />

              <!-- Chat History Section -->
              <div
                *ngIf="item.label === 'Chat History' && !isLeftSidebarCollapsed()"
                class="h-[25vh]"
              >
                <app-chat-history />
              </div>
            </li>
          </ul>
        </div>
      </div>

      <!--user profile section -->
      <div class="flex flex-col gap-4 btttom-stcky pb-4 bg-white absolute bottom-0 z-[200] w-[80%] rounded-2xl">
        <div class="bg-[#E9EAEB] h-[1px]"></div>
        <div class="flex justify-between w-full">
          <div class="flex gap-2">
            <!-- profile first letter section-->
            <div class="flex justify-start items-center gap-[10px]">
                <span class="text-primary bg-[#e9eef8] flex rounded-[200px] w-[40px] h-[40px] justify-center items-center">{{ getFirstLetter(userName) }}</span>
                <!--/* <img class="border border-gray-300 rounded-[200px] w-[40px] h-[40px] justify-center items-center" *ngIf="profileImageUrl" [src]="profileImageUrl" alt="User profile picture"> */-->
            </div>
            <!-- profile name section-->
            <div *ngIf="!isLeftSidebarCollapsed()" class="">
              <p class="text-title-color font-bold text-base">{{userName}}</p>
              <p class="text-tertiary-text-color text-sm font-normal truncate whitespace-nowrap overflow-hidden">{{userRole}}</p>
            </div>
            
          </div>
          <!-- profile logout section-->
          <!--/* <div *ngIf="!isLeftSidebarCollapsed()" class="ml-auto inline-block">
            <div (click)="logout()" class="w-[36px] h-[36px] rounded-[8px] mx-auto bg-[url('./app/resources/icons/right-arrow-icon.svg')]"></div>
          </div> */-->
        </div>
      </div>
    </div>
  </div>
  <!--/* close sidebar button */-->
  <button *ngIf="isLeftSidebarCollapsed()" class="flex mt-[30px] ml-[-10px] z-110" (click)="toggleCollapse()">
      <span class="w-[15.83px] h-[15.83px] bg-[url('./app/resources/icons/gray-open-icon.svg')]">
      </span>
  </button>
</div>
