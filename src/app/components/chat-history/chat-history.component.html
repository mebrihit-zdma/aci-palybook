<div class="transition-opacity duration-500 overflow-y-auto h-[100%] px-2 flex-col">

  <ul *ngIf="searchValue.trim() === ''">
    <li *ngFor="let chat of chatHistory; trackBy: trackChat"
    class="relative px-2 text-[#919399] text-sm py-[8px] cursor-pointer"
    (click)="selectChat(chat.sessionId)">
      <div class="w-full flex justify-between">
        <div class="relative group">
          <span class="line-clamp-1 truncate max-w-[200px]">
            {{ chat.question }}
          </span>
          <!--/* Tooltip  */-->
          <div
          class="absolute  z-50 bg-white border border-[#D5D7DA] rounded-lg text-[#2C2D2E]
                  text-xs whitespace-pre-wrap p-2 shadow-lg transition-all
                  scale-0 group-hover:scale-100 max-w-[800px]
                  break-words delay-900 duration-10"
          >
            {{ chat.question }}
          </div>
        </div>

        <!--/* delete Session button */-->
        <!--/* <button class="mt-auto mb-auto scale-[0.9] w-[9.33px] h-[12px] bg-[url('./app/resources/icons/delete-prompt-icon.svg')]"
            (click)="deleteSession(chat.sessionId); $event.stopPropagation()">
        </button> */-->
        <!-- Three-dot menu toggle -->
        <div class="flex justify-between">
          <button 
            class="mt-auto mb-auto w-[12px] h-[3px] bg-[url('./app/resources/icons/shourtcut-icon.svg')]" 
            (click)="openDeleteSession(chat.sessionId); $event.stopPropagation()">
          </button>
        </div>
        <div 
          class="absolute flex flex-col gap-[8px] top-[28px] right-[8px] z-50 bg-white border border-[#D5D7DA] rounded-lg text-[#2C2D2E]
          text-xs p-2 shadow-lg"
          [ngClass]="selectedSession === chat.sessionId ? '' : 'hidden'"
          (click)="$event.stopPropagation()">
          <button class="flex gap-[6px]" (click)="deleteSession(chat.sessionId); $event.stopPropagation()">
            <span class="mt-auto mb-auto w-[9.33px] h-[12px] bg-[url('./app/resources/icons/delete-prompt-icon.svg')]"></span>
            <span class="my-auto text-[11px]">Delete</span>
          </button>
        </div>
      </div>
    </li>

    <hr class="text-[#DFDFDF80]">
  </ul>

  <ul *ngIf="searchValue.trim() !== ''">
    <li *ngFor="let chat of filteredChatHistory; trackBy: trackChat"
        class="px-6 text-[#919399] text-sm py-[8px] truncate cursor-pointer"
        (click)="selectChat(chat.sessionId)"
        [innerHTML]="chat.highlightedQuestion">
    </li>
    <hr class="text-[#DFDFDF80]">
  </ul>

</div>
