<div class="transition-opacity duration-500 overflow-y-auto h-[100%] px-2 flex-col">

  <ul *ngIf="searchValue.trim() === ''">
    <li *ngFor="let chat of chatHistory; trackBy: trackChat"
    class="px-2 text-[#919399] text-sm py-[8px] cursor-pointer"
    (click)="selectChat(chat.sessionId)">
      <div class="w-full flex justify-between">
        <div class="relative group">
          <span class="line-clamp-1 truncate max-w-[200px]">
            {{ chat.question }}
          </span>
          <!--/* Tooltip  */-->
          <div
          class="absolute  z-50 bg-white border border-[#D5D7DA] rounded-lg text-[#2C2D2E]
                  text-xs whitespace-pre-wrap p-2 shadow-lg transition-all
                  scale-0 group-hover:scale-100 max-w-[800px]
                  break-words delay-900 duration-30"
          >
            {{ chat.question }}
          </div>
        </div>
        <!--/* delete Session button */-->
        <button class="mt-auto mb-auto scale-[0.9] w-[9.33px] h-[12px] bg-[url('./app/resources/icons/delete-prompt-icon.svg')]"
            (click)="deleteSession(chat.sessionId); $event.stopPropagation()">
        </button>
      </div>
    </li>

    <hr class="text-[#DFDFDF80]">
  </ul>

  <ul *ngIf="searchValue.trim() !== ''">
    <li *ngFor="let chat of filteredChatHistory; trackBy: trackChat"
        class="px-6 text-[#919399] text-sm py-[8px] truncate cursor-pointer"
        (click)="selectChat(chat.sessionId)"
        [innerHTML]="chat.highlightedQuestion">
    </li>
    <hr class="text-[#DFDFDF80]">
  </ul>

</div>
