<div class="transition-opacity duration-500 overflow-y-auto h-[100%] flex-col">

  <ul *ngIf="searchValue.trim() === ''" class="py-2">
    <li *ngFor="let chat of chatHistory; trackBy: trackChat"
    class="group relative px-4 text-caption-color text-sm py-[8px] cursor-pointer rounded-2xl hover:bg-[#F6F6F6]"
    (click)="selectChat(chat.sessionId)">
      <div class="w-full flex justify-between">
        <div class="relative tooltip-btn">
          <span class="line-clamp-1 truncate max-w-[170px] group-hover:max-w-[150px]">
            {{ chat.question }}
          </span>
          <!-- Tooltip  -->
          <div
          class="absolute z-50 bg-white border border-[#D5D7DA] rounded-lg text-primary-text-color
                  text-xs whitespace-pre-wrap p-2 shadow-lg transition-all
                  max-w-[800px] tooltip-text
                  break-words delay-900 duration-10"
          >
            {{ chat.question }}
          </div>
        </div>
        <!-- Three-dot menu toggle -->
        <div class="flex justify-between transition-all scale-0 group-hover:scale-100">
          <button 
            class="cursor-pointer" 
            (click)="openDeleteSession(chat.sessionId); $event.stopPropagation()">...
          </button>
        </div>
        <!-- delete Session -->
        <div 
          class="absolute right-[0px] flex flex-col top-[28px] right-[-8px] z-50  border border-[#D5D7DA] rounded-lg text-primary-text-color text-xs p-1 shadow-lg bg-white"
          [ngClass]="selectedSession === chat.sessionId ? '' : 'hidden'"
          (click)="$event.stopPropagation()" #menuRef>
          <!-- delete Session -->
          <button class="flex" (click)="deleteSession(chat.sessionId); $event.stopPropagation()">
            <span class="material-icons scale-[.8]">delete</span>
            <span class="my-auto">Delete</span>
          </button>
        </div>
      </div>
    </li>

    <hr class="text-[#DFDFDF80]">
  </ul>
  <!-- search Values -->
  <ul *ngIf="searchValue.trim() !== ''" class="py-2">
    <li *ngFor="let chat of filteredChatHistory; trackBy: trackChat"
        class=" px-4 text-caption-color text-sm py-[8px] cursor-pointer rounded-2xl hover:bg-[#F6F6F6] truncate"
        (click)="selectChat(chat.sessionId)"
        [innerHTML]="chat.highlightedQuestion">
    </li>
    <hr class="text-[#DFDFDF80]">
  </ul>

</div>
