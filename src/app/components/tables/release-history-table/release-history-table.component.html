<div class="bg-white border border-[#E9EAEB] rounded-xl text-sm text-caption-color text-sm pt-[4px]">
    <ul>
        <li class="grid grid-cols-[1.5fr_1fr_1fr_1fr_1fr_0.5fr] gap-16 border-b-1 border-[#E9EAEB] py-3 px-4 ps-[24px]">
            <div class="flex items-center">
                Documentation
            </div>
            <div class="flex items-center">Product Type</div>
            <div class="flex items-center">Template Type</div>
            <div class="flex items-center gap-[4px]">
                Published date
                <span class="w-[16px] h-[16px] bg-[url('./app/resources/icons/black-down-arrow-icon.svg')] ">
                </span>
            </div>
            <div class="flex items-center">Created by</div>
        </li>
        <li class="grid grid-cols-[1.5fr_1fr_1fr_1fr_1fr_0.5fr] gap-16 border-b-1 border-[#E9EAEB] py-3 px-4 ps-[24px]" *ngFor="let item of paginatedItems">
             <!-- First column (filename) -->
            <div class="flex items-center min-w-0">
                <span
                class="truncate block w-full"
                [innerHTML]="item.pdf_filename | highlight: searchTerm"
                ></span>
            </div>
            <div class="flex items-center whitespace-nowrap" [innerHTML]="item.product_type | highlight: searchTerm"></div>
            <div class="flex items-center whitespace-nowrap" [innerHTML]="item.template_type | highlight: searchTerm"></div>
            <div class="flex items-center whitespace-nowrap" [innerHTML]="(item.release_date | date:'MM/dd/yyyy') | highlight: searchTerm"></div>
            <div class="flex justify-start items-center gap-[10px]">
                <span class="text-primary bg-[#e9eef8] flex rounded-[200px] w-[40px] h-[40px] justify-center items-center">{{ getFirstLetter(item.created_by) }}</span>
                <span class="whitespace-nowrap" [innerHTML]="item.created_by | highlight: searchTerm"></span>
            </div>
            <div class="flex items-center">
                <a class="text-primary font-semibold" href="{{ item.pdf_url }}" target="_blank">View</a>
            </div>
        </li>
        <!-- No results message -->
        <li *ngIf="data.length === 0" class="text-center py-8 text-gray-500">
            <div class="flex flex-col items-center gap-2">
                <span class="text-lg">No documentation found</span>
                <span class="text-sm">Try adjusting your search criteria</span>
            </div>
        </li>
    </ul>
    <!-- pagination controls -->
    <div class="flex justify-between items-center ps-[24px] pe-[50px] py-[8px]">
        <span class="text-gray-500">{{ currentPage }} of {{ totalPages }}</span>
        <div class="flex gap-[12px]">
            <button (click)="prevPage()" [disabled]="currentPage === 1" class="scale-[1.5]">‹</button>
            <span>Page {{ currentPage }} of {{ totalPages }}</span>
            <button (click)="nextPage()" [disabled]="currentPage >= totalPages" class="scale-[1.5]">›</button>
        </div>
    </div>
</div>
